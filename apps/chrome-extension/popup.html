<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Browser Use</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="top">
        <img src="icons/icon-32.png" width="20" height="20" alt="" />
        <h1>Open Browser Use <span id="version" class="muted"></span></h1>
        <span class="status" id="status" data-state="unknown">
          <span class="dot" aria-hidden="true"></span><span id="status-label">Checking</span>
        </span>
      </header>

      <section class="offline" id="offline" hidden>
        <p class="offline-title" id="offline-title">Agents can't reach this profile.</p>
        <p class="offline-error" id="offline-error" hidden></p>
        <div class="row">
          <button type="button" class="btn primary" id="reconnect">Reconnect</button>
          <span class="muted small">Still failing? Run <code>open-browser-use setup</code></span>
        </div>
      </section>

      <section aria-labelledby="tab-heading">
        <h2 id="tab-heading">This tab</h2>
        <div class="card" id="current-tab"></div>
      </section>

      <section aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Agent tasks <span class="count" id="task-count"></span></h2>
        <div id="tasks"></div>
      </section>

      <footer class="settings">
        <label class="toggle">
          <span>
            <span class="toggle-title">WebMCP page tools</span>
            <span class="muted small">Let agents call tools that websites expose.</span>
          </span>
          <input type="checkbox" id="webmcp" role="switch" />
        </label>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
