<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Browser Use</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="top">
        <img class="logo" src="icons/icon-32.png" width="18" height="18" alt="" />
        <h1>Open Browser Use</h1>
        <button type="button" class="status" id="status" data-state="unknown" disabled>
          <span class="dot" aria-hidden="true"></span><span id="status-label">Checking</span>
        </button>
      </header>

      <div class="offline" id="offline" role="status" hidden>
        <span class="offline-text">
          <strong id="offline-title">Can't reach the CLI</strong>
          <span class="mono muted" id="offline-error"></span>
        </span>
        <button type="button" class="btn sm" id="reconnect">Retry</button>
      </div>

      <section class="here" id="here" aria-label="This tab"></section>

      <section id="tasks-section" aria-labelledby="tasks-heading">
        <div class="section-head">
          <h2 id="tasks-heading">Agents</h2>
          <span class="count" id="task-count"></span>
        </div>
        <div class="stack" id="tasks"></div>
      </section>

      <section id="results-section" aria-labelledby="results-heading" hidden>
        <div class="section-head">
          <h2 id="results-heading">Results</h2>
          <span class="count" id="result-count"></span>
        </div>
        <div class="card list" id="results"></div>
      </section>

      <footer class="foot">
        <label class="switch" title="Let agents call tools that websites expose (WebMCP)">
          <input type="checkbox" id="webmcp" role="switch" />
          <span>Page tools</span>
        </label>
        <span class="mono muted" id="version"></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
